app-id: com.github.Magpiny.SysInfoViewer
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: SysInfoViewer

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # Network access (for libcurl)
  - --share=network
  # Sound access (for ALSA)
  - --socket=pulseaudio
  # Device access for hardware info
  - --device=dri
  # System bus access for hardware information
  - --system-talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.NetworkManager
  # Filesystem access for reading system info (read-only)
  - --filesystem=/sys:ro
  - --filesystem=/proc:ro
  - --filesystem=host:ro
  # Access to /etc for system configuration info
  - --filesystem=/etc:ro

modules:
  # wxWidgets module
  - name: wxwidgets
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_TOOLKIT=gtk3
      - -DwxBUILD_SHARED=ON
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_LIBSDL=OFF
      - -DwxUSE_WEBVIEW=OFF
    cleanup:
      - /bin
      - /share/bakefile
      - /share/aclocal
      - /lib/wx/include
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.8/wxWidgets-3.2.8.tar.bz2
        sha256: c74784904109d7229e6894c85cfa068f1106a4a07c144afd78af41f373ee0fe6
        x-checker-data:
          type: anitya
          project-id: 5150
          stable-only: true
          url-template: https://github.com/wxWidgets/wxWidgets/releases/download/v$version/wxWidgets-$version.tar.bz2

  # libdrm module (for display info)
  - name: libdrm
    buildsystem: meson
    config-opts:
      - -Dudev=true
      - -Dvalgrind=disabled
      - -Dcairo-tests=disabled
      - -Dintel=disabled
      - -Dradeon=disabled
      - -Damdgpu=disabled
      - -Dnouveau=disabled
      - -Dvmwgfx=disabled
    cleanup:
      - /share/man
      - /share/libdrm
    sources:
      - type: archive
        url: https://dri.freedesktop.org/libdrm/libdrm-2.4.128.tar.xz
        sha256: 3bb35db8700c2a0b569f2c6729a53f5495786856b310854c8de57782a22bddac
        x-checker-data:
          type: anitya
          project-id: 1596
          stable-only: true
          url-template: https://dri.freedesktop.org/libdrm/libdrm-$version.tar.xz

  # ImageMagick for icon conversion
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-docs
      - --with-modules
      - --with-threads
      - --without-magick-plus-plus
    cleanup:
      - /share/doc
      - /share/man
      - "*.la"
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/7.1.1-29.tar.gz
        sha256: 27bd25f945efdd7e38f6f9845a7c0a391fdb732f652dda140b743769c5f106e8

  # Your application
  - name: sysinfoviewer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_CXX_STANDARD=23  # Enforce C++23 (or 20/17 if testing)
      - -DCMAKE_CXX_STANDARD_REQUIRED=ON  # Fail if compiler can't handle it
      - -DCMAKE_CXX_EXTENSIONS=OFF  # Use -std=c++23, not GNU extensions
    sources:
      # Use git source for Flathub submission
      - type: git
        url: https://github.com/Magpiny/SysInfoViewer.git
        tag: v0.2.0
        commit: fc361f12dba292e4065a54e2a96b30abb9761583
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

      # Alternative: If using archive releases
      # - type: archive
      #   url: https://github.com/yourusername/SysInfoViewer/archive/refs/tags/v0.1.0.tar.gz
      #   sha256: YOUR_SHA256_HERE
      #   x-checker-data:
      #     type: anitya
      #     project-id: YOUR_PROJECT_ID
      #     stable-only: true
      #     url-template: https://github.com/yourusername/SysInfoViewer/archive/refs/tags/v$version.tar.gz

    build-commands:
      # Convert .ico to .png for proper Linux icon support
      - |
        if [ -f favicon.ico ]; then
          magick convert favicon.ico[0] -resize 256x256 sysinfoviewer-256.png
          magick convert favicon.ico[0] -resize 128x128 sysinfoviewer-128.png
          magick convert favicon.ico[0] -resize 64x64 sysinfoviewer-64.png
          magick convert favicon.ico[0] -resize 48x48 sysinfoviewer-48.png
        fi

    post-install:
      # Install icons in proper hicolor theme directories
      - |
        for size in 256 128 64 48; do
          if [ -f sysinfoviewer-${size}.png ]; then
            install -Dm644 sysinfoviewer-${size}.png \
              /app/share/icons/hicolor/${size}x${size}/apps/com.github.Magpiny.sysInfoviewer.png
          fi
        done

      # Install desktop file with correct app-id naming
      - install -Dm644 SysInfoViewer.desktop /app/share/applications/com.github.Magpiny.sysinfoviewer.desktop

      # Update desktop file to use correct app-id and icon
      - desktop-file-edit --set-key=Icon --set-value=com.github.Magpiny.sysinfoviewer /app/share/applications/com.github.Magpiny.sysinfoviewer.desktop
      - desktop-file-edit --set-key=Exec --set-value=SysInfoViewer /app/share/applications/com.github.Magpiny.sysinfoviewer.desktop

      # Validate desktop file (Flathub requirement)
      - desktop-file-validate /app/share/applications/com.github.Magpiny.sysinfoviewer.desktop

      # Install AppStream metadata (required for Flathub)
      - install -Dm644 com.github.Magpiny.sysinfoviewer.metainfo.xml /app/share/metainfo/com.github.Magpiny.sysinfoviewer.metainfo.xml

      # Validate AppStream metadata (Flathub requirement)
      - appstream-util validate-relax /app/share/metainfo/com.github.Magpiny.sysinfoviewer.metainfo.xml
