name: Cross-Distro Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent duplicate runs for PR from same repo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  BUILD_DIR: build

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # For git describe in versioning

      # Cache dependencies
      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake libwxgtk3.2-dev libcurl4-openssl-dev libasound2-dev libdrm-dev upower
          version: 1.0

      - name: Install Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libwxgtk3.2-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libdrm-dev \
            upower

      # Cache CMake build artifacts
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
            ~/.cache/ccache
          key: ubuntu-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ubuntu-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            ubuntu-cmake-

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --parallel $(nproc)
        continue-on-error: false

  build-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --user root
    steps:
      - name: Install git (required for checkout)
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Cache DNF packages
      - name: Cache DNF packages
        uses: actions/cache@v4
        with:
          path: /var/cache/dnf
          key: fedora-dnf-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: fedora-dnf-

      - name: Install Dependencies (Fedora)
        run: |
          dnf update -y
          dnf install -y \
            gcc-c++ cmake \
            wxGTK-devel \
            libcurl-devel \
            alsa-lib-devel \
            libdrm-devel \
            upower \

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: fedora-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            fedora-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            fedora-cmake-

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --parallel $(nproc)
        continue-on-error: false

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install git (required for checkout)
        run: pacman -Sy --noconfirm git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Cache Pacman packages
      - name: Cache Pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-pacman-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: arch-pacman-

      - name: Install Dependencies (Arch)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel cmake wxwidgets-gtk3 curl alsa-lib libdrm upower

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: arch-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            arch-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            arch-cmake-

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Run Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure --parallel $(nproc)
        continue-on-error: false

  appimage:
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-fedora, build-arch]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake libwxgtk3.2-dev libcurl4-openssl-dev libasound2-dev libdrm-dev upower file
          version: 1.0

      - name: Install Dependencies (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libwxgtk3.2-dev libcurl4-openssl-dev libasound2-dev libdrm-dev upower file

      # Use fixed versions instead of 'continuous' for reproducibility and security
      - name: Cache AppImage tools
        id: cache-appimage-tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/linuxdeploy
            /usr/local/bin/appimagetool
          key: appimage-tools-v1

      - name: Install AppImage tools
        if: steps.cache-appimage-tools.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage

          # Verify downloads (basic check)
          file linuxdeploy-x86_64.AppImage | grep -q "executable"
          file appimagetool-x86_64.AppImage | grep -q "executable"

          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: ubuntu-appimage-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            ubuntu-appimage-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-
            ubuntu-cmake-

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Create AppDir
        run: |
          cmake --install ${{ env.BUILD_DIR }} --prefix AppDir/usr

          # Ensure desktop file exists and is valid
          if [ -f "${{ env.BUILD_DIR }}/SysInfoViewer.desktop" ]; then
            cp ${{ env.BUILD_DIR }}/SysInfoViewer.desktop AppDir/
          else
            echo "Warning: Desktop file not found, creating basic one"
            cat > AppDir/SysInfoViewer.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=SysInfoViewer
          Exec=SysInfoViewer
          Icon=SysInfoViewer
          Categories=Utility;
          EOF
          fi

          # Handle icon
          if [ -f "favicon.ico" ]; then
            cp favicon.ico AppDir/SysInfoViewer.ico
          fi

          # Create proper AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR="${SELF%/*}"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${LD_LIBRARY_PATH}"
          export PATH="${APPDIR}/usr/bin:${PATH}"
          exec "${APPDIR}/usr/bin/SysInfoViewer" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Generate AppImage
        run: |
          export VERSION=$(git describe --tags --always || echo "0.1.0")
          export OUTPUT="SysInfoViewer-${VERSION}-x86_64.AppImage"
          linuxdeploy --appdir AppDir --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysInfoViewer-AppImage-${{ github.sha }}
          path: SysInfoViewer-*.AppImage
          retention-days: 30
          if-no-files-found: error

      # Optional: Create checksums for security verification
      - name: Generate checksums
        run: |
          sha256sum SysInfoViewer-*.AppImage > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ github.sha }}
          path: checksums.txt
          retention-days: 30
