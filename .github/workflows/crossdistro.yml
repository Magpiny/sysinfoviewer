name: Cross-Distro Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent duplicate runs for PR from same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release
  BUILD_DIR: build

jobs:
  # =========================================================================
  # 1. Ubuntu / Debian Build & DEB / Tarball Packaging
  # =========================================================================
  build-ubuntu:
    name: Build & Package (Ubuntu / Debian)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake dpkg-dev fakeroot file libwxgtk3.2-dev libcurl4-openssl-dev libasound2-dev libdrm-dev upower
          version: 1.1

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake dpkg-dev fakeroot file \
            libwxgtk3.2-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libdrm-dev \
            upower

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Verify binary & dynamic linking
        run: |
          test -x ${{ env.BUILD_DIR }}/sysinfoviewer
          file ${{ env.BUILD_DIR }}/sysinfoviewer
          ldd ${{ env.BUILD_DIR }}/sysinfoviewer

      - name: Generate DEB and Tarball packages via CPack
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cpack -G "DEB;TGZ"
          mkdir -p ../dist
          cp *.deb *.tar.gz ../dist/

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/*.deb
          retention-days: 14

      - name: Upload Tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist/*.tar.gz
          retention-days: 14

  # =========================================================================
  # 2. Fedora / RPM Build & RPM Packaging
  # =========================================================================
  build-fedora:
    name: Build & Package (Fedora / RPM)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: --user root
    steps:
      - name: Install git & core tools
        run: dnf install -y git rpm-build file

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Fedora)
        run: |
          dnf update -y
          dnf install -y \
            gcc-c++ cmake \
            wxGTK-devel \
            libcurl-devel \
            alsa-lib-devel \
            libdrm-devel \
            upower

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Verify binary
        run: |
          test -x ${{ env.BUILD_DIR }}/sysinfoviewer
          file ${{ env.BUILD_DIR }}/sysinfoviewer
          ldd ${{ env.BUILD_DIR }}/sysinfoviewer

      - name: Generate RPM package via CPack
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cpack -G RPM
          mkdir -p ../dist
          cp *.rpm ../dist/

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: dist/*.rpm
          retention-days: 14

  # =========================================================================
  # 3. Arch Linux Build & Verification
  # =========================================================================
  build-arch:
    name: Build & Verification (Arch Linux)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install git & base tools
        run: pacman -Sy --noconfirm git base-devel

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies (Arch)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm cmake wxwidgets-gtk3 curl alsa-lib libdrm upower file

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Verify binary
        run: |
          test -x ${{ env.BUILD_DIR }}/sysinfoviewer
          file ${{ env.BUILD_DIR }}/sysinfoviewer

  # =========================================================================
  # 4. AppImage Build & Packaging
  # =========================================================================
  appimage:
    name: Build & Package (AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential cmake file wget libwxgtk3.2-dev libcurl4-openssl-dev libasound2-dev libdrm-dev upower
          version: 1.1

      - name: Install dependencies (AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake file wget \
            libwxgtk3.2-dev \
            libcurl4-openssl-dev \
            libasound2-dev \
            libdrm-dev \
            upower

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile project
        run: cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)

      - name: Stage AppDir Structure
        run: |
          cmake --install ${{ env.BUILD_DIR }} --prefix AppDir/usr

          # Copy desktop file and icon to AppDir root for linuxdeploy
          cp AppDir/usr/share/applications/sysinfoviewer.desktop AppDir/
          if [ -f "sysinfoviewer.png" ]; then
            cp sysinfoviewer.png AppDir/
          elif [ -f "favicon.ico" ]; then
            cp favicon.ico AppDir/sysinfoviewer.ico
          fi

          # Create reliable AppRun launcher
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          APPDIR="${SELF%/*}"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${APPDIR}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          export PATH="${APPDIR}/usr/bin:${PATH}"
          exec "${APPDIR}/usr/bin/sysinfoviewer" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Install linuxdeploy and build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appdir AppDir --output appimage

          mkdir -p dist
          # Normalize AppImage naming
          VERSION=$(git describe --tags --always 2>/dev/null || echo "0.3.3")
          mv SysInfoViewer-*.AppImage dist/SysInfoViewer-${VERSION}-x86_64.AppImage || mv *.AppImage dist/SysInfoViewer-${VERSION}-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: dist/*.AppImage
          retention-days: 14

  # =========================================================================
  # 5. Consolidate Release Assets & Publish to GitHub Releases
  # =========================================================================
  release:
    name: Publish Release Packages
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-fedora, build-arch, appimage]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release assets directory
        run: mkdir -p release_assets

      - name: Download DEB package
        uses: actions/download-artifact@v4
        with:
          name: package-deb
          path: release_assets

      - name: Download RPM package
        uses: actions/download-artifact@v4
        with:
          name: package-rpm
          path: release_assets

      - name: Download AppImage package
        uses: actions/download-artifact@v4
        with:
          name: package-appimage
          path: release_assets

      - name: Download Tarball package
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: release_assets

      - name: Generate SHA-256 Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload all packages bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysinfoviewer-all-packages
          path: release_assets/*
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*.deb
            release_assets/*.rpm
            release_assets/*.AppImage
            release_assets/*.tar.gz
            release_assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
