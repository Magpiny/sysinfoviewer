app-id: com.wanjaresamuel.SysInfoViewer
runtime: org.freedesktop.Platform
runtime-version: "23.08"
sdk: org.freedesktop.Sdk
command: SysInfoViewer

finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # Network access (for libcurl)
  - --share=network
  # Sound access (for ALSA)
  - --socket=pulseaudio
  # Device access for hardware info
  - --device=dri
  # System bus access for hardware information
  - --system-talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.NetworkManager
  # Filesystem access for reading system info (read-only)
  - --filesystem=/sys:ro
  - --filesystem=/proc:ro
  # Access to /etc for system configuration info
  - --filesystem=/etc:ro

modules:
  # wxWidgets module
  - name: wxwidgets
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_TOOLKIT=gtk3
      - -DwxBUILD_SHARED=ON
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_LIBSDL=OFF
      - -DwxUSE_WEBVIEW=OFF
    cleanup:
      - /bin
      - /share/bakefile
      - /share/aclocal
      - /lib/wx/include
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.4/wxWidgets-3.2.4.tar.bz2
        sha256: 0640e1ab716db5af2ecb7389dbef6138d7679261fbff730d23845ba838ca133e
        x-checker-data:
          type: anitya
          project-id: 5150
          stable-only: true
          url-template: https://github.com/wxWidgets/wxWidgets/releases/download/v$version/wxWidgets-$version.tar.bz2

  # libdrm module (for display info)
  - name: libdrm
    buildsystem: meson
    config-opts:
      - -Dudev=true
      - -Dvalgrind=disabled
      - -Dcairo-tests=disabled
      - -Dintel=disabled
      - -Dradeon=disabled
      - -Damdgpu=disabled
      - -Dnouveau=disabled
      - -Dvmwgfx=disabled
    cleanup:
      - /share/man
      - /share/libdrm
    sources:
      - type: archive
        url: https://dri.freedesktop.org/libdrm/libdrm-2.4.120.tar.xz
        sha256: 3bf55363f76c7250946441ab51d3a6cc0ae518055c0ff017324ab76cdefb327a
        x-checker-data:
          type: anitya
          project-id: 1596
          stable-only: true
          url-template: https://dri.freedesktop.org/libdrm/libdrm-$version.tar.xz

  # ImageMagick for icon conversion
  - name: imagemagick
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-docs
      - --with-modules
      - --with-threads
      - --without-magick-plus-plus
    cleanup:
      - /share/doc
      - /share/man
      - "*.la"
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/7.1.1-29.tar.gz
        sha256: 27bd25f945efdd7e38f6f9845a7c0a391fdb732f652dda140b743769c5f106e8

  # Your application
  - name: sysinfoviewer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DCMAKE_CXX_STANDARD=23
      - -DCMAKE_CXX_STANDARD_REQUIRED=ON
      - -DCMAKE_CXX_EXTENSIONS=OFF
    sources:
      # Use git source for Flathub submission
      - type: git
        url: https://github.com/Magpiny/SysInfoViewer.git
        tag: v0.2.0-2
        commit: 1bc16119f2e9199c972ae71b03576f93b5b4dd2f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

      # Alternative: If using archive releases
      # - type: archive
      #   url: https://github.com/yourusername/SysInfoViewer/archive/refs/tags/v0.1.0.tar.gz
      #   sha256: YOUR_SHA256_HERE
      #   x-checker-data:
      #     type: anitya
      #     project-id: YOUR_PROJECT_ID
      #     stable-only: true
      #     url-template: https://github.com/yourusername/SysInfoViewer/archive/refs/tags/v$version.tar.gz

    build-commands:
      # Convert .ico to .png for proper Linux icon support
      - |
        if [ -f favicon.ico ]; then
          magick convert favicon.ico[0] -resize 256x256 sysinfoviewer-256.png
          magick convert favicon.ico[0] -resize 128x128 sysinfoviewer-128.png
          magick convert favicon.ico[0] -resize 64x64 sysinfoviewer-64.png
          magick convert favicon.ico[0] -resize 48x48 sysinfoviewer-48.png
        fi

    post-install:
      # Install icons in proper hicolor theme directories
      - |
        for size in 256 128 64 48; do
          if [ -f sysinfoviewer-${size}.png ]; then
            install -Dm644 sysinfoviewer-${size}.png \
              /app/share/icons/hicolor/${size}x${size}/apps/com.wanjaresamuel.SysInfoViewer.png
          fi
        done

      # Install desktop file with correct app-id naming
      - install -Dm644 SysInfoViewer.desktop /app/share/applications/com.wanjaresamuel.SysInfoViewer.desktop

      # Update desktop file to use correct app-id and icon
      - desktop-file-edit --set-key=Icon --set-value=com.wanjaresamuel.SysInfoViewer /app/share/applications/com.wanjaresamuel.SysInfoViewer.desktop
      - desktop-file-edit --set-key=Exec --set-value=SysInfoViewer /app/share/applications/com.wanjaresamuel.SysInfoViewer.desktop

      # Validate desktop file (Flathub requirement)
      - desktop-file-validate /app/share/applications/com.wanjaresamuel.SysInfoViewer.desktop

      # Install AppStream metadata (required for Flathub)
      - install -Dm644 com.wanjaresamuel.SysInfoViewer.metainfo.xml /app/share/metainfo/com.wanjaresamuel.SysInfoViewer.metainfo.xml

      # Validate AppStream metadata (Flathub requirement)
      - appstream-util validate-relax /app/share/metainfo/com.wanjaresamuel.SysInfoViewer.metainfo.xml
